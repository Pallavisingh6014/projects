<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e2b48;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator-card {
            background-color: #c9c1d1;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #dc37a2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #33022a;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #5d49e4;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: none; 
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Grade Calculator</h2>
        
        <div class="input-group">
            <label for="math">Maths:</label>
            <input type="number" id="math" placeholder="Enter marks (0-100)" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="science">Science:</label>
            <input type="number" id="science" placeholder="Enter marks (0-100)" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="english">English:</label>
            <input type="number" id="english" placeholder="Enter marks (0-100)" min="0" max="100">
        </div>

        <button onclick="calculateGrade()">Calculate Grade</button>

        <div id="result" class="result-box"></div>
    </div>

    <script>
        function calculateGrade() {
           
            const math = parseFloat(document.getElementById('math').value);
            const science = parseFloat(document.getElementById('science').value);
            const english = parseFloat(document.getElementById('english').value);
            const resultBox = document.getElementById('result');

            if (isNaN(math) || isNaN(science) || isNaN(english)) {
                resultBox.style.display = "block";
                resultBox.style.color = "red";
                resultBox.innerHTML = "Please enter marks for all fields.";
                return;
            }

            if (math < 0 || math > 100 || science < 0 || science > 100 || english < 0 || english > 100) {
                resultBox.style.display = "block";
                resultBox.style.color = "red";
                resultBox.innerHTML = "Marks must be between 0 and 100.";
                return;
            }

            
            const totalMarks = math + science + english;
            const percentage = (totalMarks / 300) * 100;
            let grade = "";

            
            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F (Fail)";
            }

            resultBox.style.display = "block";
            resultBox.style.color = "#333"; 
            resultBox.innerHTML = `
                Total Marks: ${totalMarks}/300 <br>
                Percentage: ${percentage.toFixed(2)}% <br>
                Grade: ${grade}
            `;
        }
    </script>

</body>
</html>
